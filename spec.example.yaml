# Vorgabe: was wird exportiert und wo landet es?
# Liegt als /data/spec.yaml im gemounteten Ordner (wird beim ersten Start automatisch angelegt).

output_dir: /data/out     # Zielordner (relativ = unterhalb /data/out)
delimiter: ","            # ";" für deutsches Excel

exports:
  # Meistgehörte Künstler/Titel. time_range: short_term (~4 Wochen), medium_term (~6 Monate), long_term (~1 Jahr)
  top_artists:
    time_ranges: [short_term, medium_term, long_term]
    limit: 50
    file: "top_artists_{time_range}.csv"
  top_tracks:
    time_ranges: [short_term, medium_term, long_term]
    limit: 50
    file: "top_tracks_{time_range}.csv"

  # Genre-Häufigkeiten. Spotify liefert Genres für Dev-Mode-Apps unzuverlässig -> Standard ist Last.fm-Tags
  # (braucht LASTFM_API_KEY). Gewicht = Anzahl Treffer des Künstlers über alle Quellen x Tag-Anteil.
  genres:
    source: lastfm             # lastfm | spotify | auto (Spotify-Genres, sonst Last.fm)
    sources: [top_artists, liked_tracks, followed_artists]   # + playlists
    time_ranges: [long_term]   # nur relevant für Quelle top_artists
    max_artist_lookups: 300    # nur die wichtigsten N Künstler auswerten (Last.fm: ~4/s, Ergebnisse werden gecacht)
    min_tag_count: 40          # Last.fm-Tag-Stärke 0-100; höher = weniger, treffendere Genres
    max_tags_per_artist: 5
    exclude_tags: []           # zusätzliche Tags ignorieren, z. B. ["german", "sad"]
    top_n: 50
    file: genres.csv

  liked_tracks:             # alle gelikten Songs; optional `limit: N` begrenzt auf die N neuesten
    file: liked_tracks.csv

  followed_artists:
    file: followed_artists.csv

  playlists:
    enabled: true
    own_only: true             # nur eigene Playlists (gefolgte Fremd-Playlists verzerren den Geschmack)
    file: playlists.csv
